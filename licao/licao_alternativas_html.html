<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Inicial</title>
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/alternativas.css" />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="/js/router.js" defer></script>
  </head>
  <body id="content">
    <main>
      <div class="toast-wrapper">
        <div class="toast-error" id="toast-error">
          <span
            ><img
              src="/imgs/x-error.svg"
              alt="ícone de erro"
              class="toast-icon"
          /></span>
          <p></p>
        </div>
      </div>
      <div class="toast-wrapper">
        <div class="toast-correct" id="toast-correct">
          <span
            ><img src="/imgs/check.svg" alt="ícone de acert" class="toast-icon"
          /></span>
          <p></p>
        </div>
      </div>
      <section id="lesson">
        <h2>Selecione a alternativa correta</h2>
        <p>Qual tag indica um título de maior procedência?</p>

        <form>
          <div id="options">
            <div class="option">
              <label>
                <input type="radio" name="option_input" value="p" />
                <div class="mark">
                  <img src="/imgs/mark.svg" />
                </div>
                <div class="marked">
                  <img src="/imgs/marked.svg" />
                </div>
                <span class="chek_mark"></span>
                p</label
              >
            </div>
            <div class="option" id="correct_input">
              <label>
                <input type="radio" name="option_input" value="h1" />
                <div class="mark">
                  <img src="/imgs/mark.svg" />
                </div>
                <div class="marked">
                  <img src="/imgs/marked.svg" />
                </div>
                h1</label
              >
            </div>

            <div class="option">
              <label>
                <input type="radio" name="option_input" value="title" />
                <div class="mark">
                  <img src="/imgs/mark.svg" />
                </div>
                <div class="marked">
                  <img src="/imgs/marked.svg" />
                </div>
                title</label
              >
            </div>
            <div class="option">
              <label>
                <input type="radio" name="option_input" value="title" />
                <div class="mark">
                  <img src="/imgs/mark.svg" />
                </div>
                <div class="marked">
                  <img src="/imgs/marked.svg" />
                </div>
                a</label
              >
            </div>
            <div id="bnt_div">
              <button id="bnt">Confirmar</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <script src="/js/licao_alternativas_html.js"></script>
  </body>
</html>
