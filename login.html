<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/index.css" />
    <link rel="stylesheet" href="/css/login.css" />
    <script src="/js/login.js" defer></script>
    <link rel="icon" href="/imgs/logo.svg" type="image/svg+xml" />
    <title>Login</title>
  </head>
  <body>
    <div class="toast-wrapper">
      <div class="toast-error" id="toast-error">
        <span
          ><img src="/imgs/x-error.svg" alt="ícone de erro" class="toast-icon"
        /></span>
        <p></p>
      </div>
    </div>
    <main>
      <div class="left">
        <div class="logo-container">
          <a class="logo" href="index.html"><img id="logo" src="/imgs/logo.svg" alt="Logo"
          /></a>
          <h1>H1Learn</h1>
          <p class="subtitle">
            o aprendizado começa<br />
            aqui.
          </p>
        </div>
        <main>
            <div class="left">
                <div class="logo-container">
                    <a href="index.html">
                        <img id="logo" src="/imgs/logo.svg" alt="Logo" />
                    </a>
                    <h1>H1Learn</h1>
                    <p class="subtitle">
                        o aprendizado começa
                        <br />
                        aqui.
                    </p>
                </div>

      <div class="ifrn_students">
        <img src="/imgs/campus.svg" />
        <p>
          Criado por alunos do Instituto Federal de Ciências, Tecnologia e
          Inovação do Rio Grande do Norte, campus Pau dos Ferros.
        </p>
      </div>
      </div>

      <div class="right">
        <form id="form">
          <img
            id="user_logo"
            src="/imgs/user.svg"
            alt="Imagem de perfil do usuário"
            loading="lazy"
          />

                    <div class="inputs">
                        <div class="email-container">
                            <input
                                type="email"
                                placeholder="Email:"
                                name="email"
                                id="email"
                            />

                            <span>
                                <img
                                    src="/imgs/email.svg"
                                    alt="Ícone de email"
                                    loading="lazy"
                                />
                            </span>
                        </div>

                        <div class="password-wrapper">
                            <div class="password-container">
                                <input
                                    type="password"
                                    placeholder="Senha:"
                                    name="password"
                                    id="password"
                                    maxlength="12"
                                />

                <span id="eye-span-1"
                  ><img
                    id="eye-password"
                    src="/imgs/password-visible.svg"
                    alt="Ícone de visualizar senha"
                    loading="lazy"
                  />
                  <img
                    id="hide-password"
                    src="/imgs/password-hidden.svg"
                    alt="Ícone de esconder senha"
                    loading="lazy"
                  />
                </span>
              </div>

                            <a href="resetar_senha.html" id="forgot-password">
                                Esqueceu sua senha?
                            </a>
                        </div>
                    </div>

                    <button type="submit">Entrar</button>

                    <p>
                        Não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                        .
                    </p>
                </form>
            </div>
        </main>
    </body>
</html>
