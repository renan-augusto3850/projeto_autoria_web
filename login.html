<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/css/index.css" />
        <link rel="stylesheet" href="/css/login.css" />
        <script src="/js/login.js" defer></script>
        <link rel="icon" href="/imgs/logo.svg" type="image/svg+xml" />
        <title>Login</title>
    </head>
    <body>
        <header>
            <a href="index.html">
                <img id="logo-header" src="/imgs/logo.svg" alt="Logo" />
            </a>
            <h2>H1Learn</h2>
        </header>

        <div class="toast-wrapper">
            <div class="toast-error" id="toast-error">
                <span>
                    <img
                        src="/imgs/nao.svg"
                        alt="ícone de erro"
                        class="toast-icon"
                    />
                </span>
                <p></p>
            </div>
        </div>
        <main>
            <div class="left">
                <div class="logo-container">
                    <a href="index.html">
                        <img id="logo" src="/imgs/logo.svg" alt="Logo" />
                    </a>
                    <h1>H1Learn</h1>
                    <p class="subtitle">
                        o aprendizado começa
                        <br />
                        aqui.
                    </p>
                </div>

                <img
                    id="ifrn"
                    src="/imgs/ifrn.svg"
                    alt="Criado por alunos do IFRN, campus Pau dos Ferros"
                />
            </div>

            <div class="right">
                <form id="form">
                    <img
                        id="user_logo"
                        src="/imgs/user_logo.svg"
                        alt="Imagem de perfil do usuário"
                        loading="lazy"
                    />

                    <div class="inputs">
                        <div class="email-container">
                            <input
                                type="email"
                                placeholder="Email:"
                                name="email"
                                id="email"
                            />

                            <span>
                                <img
                                    src="/imgs/email.svg"
                                    alt="Ícone de email"
                                    loading="lazy"
                                />
                            </span>
                        </div>

                        <div class="password-wrapper">
                            <div class="password-container">
                                <input
                                    type="password"
                                    placeholder="Senha:"
                                    name="password"
                                    id="password"
                                    maxlength="12"
                                />

                                <span id="eye-span-1">
                                    <img
                                        id="eye-password"
                                        src="/imgs/password.svg"
                                        alt="Ícone de visualizar senha"
                                        loading="lazy"
                                    />
                                    <img
                                        id="hide-password"
                                        src="/imgs/password2.svg"
                                        alt="Ícone de esconder senha"
                                        loading="lazy"
                                    />
                                </span>
                            </div>

                            <a href="resetar_senha.html" id="forgot-password">
                                Esqueceu sua senha?
                            </a>
                        </div>
                    </div>

                    <button type="submit">Entrar</button>

                    <p>
                        Não tem uma conta?
                        <a href="cadastro.html">Cadastre-se</a>
                        .
                    </p>
                </form>
            </div>
        </main>
    </body>
</html>
